name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'
      - run: dotnet workload install maui-android
      - name: Android-SDK-Abhängigkeiten bereitstellen
        run: dotnet build src/ProjectMass.Android -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true
      - name: APK bauen und signieren
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing=()
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            umask 077
            keystore="$RUNNER_TEMP/project-mass-release.jks"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            signing=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$keystore" "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
                     -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD)
          else
            echo "::warning::Android-Signatur-Secrets fehlen. Das APK wird mit dem Debug-Schlüssel signiert."
          fi
          dotnet publish src/ProjectMass.Android -f net10.0-android -c Release "${signing[@]}"
          mapfile -t apks < <(find src/ProjectMass.Android/bin/Release/net10.0-android/publish -maxdepth 1 -name '*-Signed.apk' -type f)
          [[ ${#apks[@]} -eq 1 ]] || { echo "::error::Genau ein signiertes APK erwartet."; exit 1; }
          mkdir -p dist
          cp "${apks[0]}" dist/project-mass.apk
      - uses: actions/upload-artifact@v7
        with:
          name: project-mass-android
          path: dist/project-mass.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: project-mass-android
          path: dist
      - name: APK an den GitHub Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/project-mass.apk
          else
            gh release create "$GITHUB_REF_NAME" dist/project-mass.apk --verify-tag --generate-notes
          fi
